[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/supervisor",
    "crates/worker",
    "crates/api",
    "crates/agents",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
swarm-core = { path = "crates/core" }
swarm-supervisor = { path = "crates/supervisor" }
swarm-worker = { path = "crates/worker" }
axum = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
